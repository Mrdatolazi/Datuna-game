name: Build Datuna iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/Datuna.xcodeproj \
            -scheme Datuna \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p ios/ipa/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Datuna.app ios/ipa/Payload/
          cd ios/ipa
          zip -r ../../Datuna.ipa Payload

      - name: Upload Datuna.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Datuna-iOS-IPA
          path: Datuna.ipa
