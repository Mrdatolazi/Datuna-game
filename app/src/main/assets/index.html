<title>Datuna</title>
<style>
:root{--bg:#10141c;--ink:#f3efe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Helvetica Neue","Noto Sans Georgian",sans-serif;touch-action:none;overscroll-behavior:none;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.g{width:100%;max-width:560px}
.wrap{position:relative}
canvas{display:block;width:100%;aspect-ratio:304/208;border:1px solid #3a4152;border-radius:14px;image-rendering:auto;background:#1a1f2b}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;border-radius:14px;background:radial-gradient(ellipse at 50% 32%,rgba(92,52,30,.66),rgba(10,12,20,.9));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);cursor:pointer;padding:0 24px;color:#fff}
#ov p{margin:0}
#t{font-size:38px;font-weight:800;letter-spacing:1px;background:linear-gradient(180deg,#fff3c0,#f2b630 60%,#c9820e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
#m{font-size:14px;line-height:1.55;color:#eef2f6;max-width:440px}
#ov .s{font-size:14px;color:#ffd27a;letter-spacing:.5px}
#lg{width:112px;height:112px;border-radius:50%;overflow:hidden;border:3px solid #f2c24a;box-shadow:0 8px 28px rgba(0,0,0,.55),0 0 0 7px rgba(242,194,74,.22);animation:fl 2.6s ease-in-out infinite}
#lg img{width:100%;height:100%;display:block;pointer-events:none}
@keyframes fl{50%{transform:translateY(-5px)}}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px}
.row div{display:flex;gap:10px}
button{height:52px;border:0;border-radius:16px;background:linear-gradient(180deg,#2d3446,#1b2030);color:#f3efe6;font-size:20px;font-family:inherit;touch-action:none;border:1px solid rgba(255,255,255,.18);box-shadow:0 3px 0 rgba(0,0,0,.4)}
button:active{background:linear-gradient(180deg,#414a62,#2a3146);transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.a{width:62px}.j{width:104px;font-size:16px}.rb{display:flex;gap:8px}.j.f{width:92px;font-size:14px}
.rot{display:none;font-size:12px;color:#bcd;margin-top:6px}
@media (orientation:landscape){
:root{padding:0}
body{padding:0;display:block}
.g{position:fixed;inset:0;max-width:none}
.wrap{position:absolute;inset:0}
canvas{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0}
#ov{border-radius:0}
#ov #lg{width:76px;height:76px}
#t{font-size:30px}
.row{position:absolute;left:0;right:0;bottom:0;margin:0;padding:0 max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));pointer-events:none}
button{pointer-events:auto;height:54px;background:rgba(10,14,22,.42);color:#fff;border:1px solid rgba(255,255,255,.38);box-shadow:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
button:active{background:rgba(255,255,255,.3);transform:none}
.a{width:64px}.j{width:110px}
